<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Black Friday Edit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cg transform='rotate(-10 24 24)'%3E%3Cpath d='M3 24 L15 10 H42 Q45 10 45 13 V35 Q45 38 42 38 H15 Z' fill='%231A1A1A'/%3E%3Ccircle cx='13' cy='24' r='2.6' fill='%23FAFAF8'/%3E%3Ctext x='31' y='30.5' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='17' fill='%23FAFAF8'%3EBF%3C/text%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: magazine masthead, then a toolbar, then sections (one per brand or type) of portrait product cards. */
:root{
  --paper:#FAFAF8; --card:#FFFFFF; --soft:#EFEEEB; --ink:#1A1A1A; --muted:#7A7874; --line:#E6E5E1;
  --accent:#1A1A1A; --accent-ink:#FAFAF8; --sale:#55613F; --ok:#55613F; --warn:#8A7A5C;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Manrope", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131312; --card:#1A1A19; --soft:#222220; --ink:#ECEBE7; --muted:#9A9893; --line:#2A2A28;
    --accent:#ECEBE7; --accent-ink:#131312; --sale:#B3BF98; --ok:#B3BF98; --warn:#C9B68E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131312; --card:#1A1A19; --soft:#222220; --ink:#ECEBE7; --muted:#9A9893; --line:#2A2A28;
  --accent:#ECEBE7; --accent-ink:#131312; --sale:#B3BF98; --ok:#B3BF98; --warn:#C9B68E;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 80px}
@media (max-width:520px){.wrap{padding:0 16px 64px}}

header.mast{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:min(9vw,44px);height:auto;flex:none}
.meta{display:grid;gap:2px;justify-items:end}
@media (max-width:640px){.meta{justify-items:start}}
.kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-style:italic;font-size:min(6.6vw,40px);line-height:1;margin:0;letter-spacing:-.01em;white-space:nowrap}
h1 b{font-style:normal;font-weight:600}
.stats{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat{display:inline}
.stat .n{font-weight:700;color:var(--ink)}
.stat .l{}
.stat.sale .n{color:var(--ink)}

.toolbar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
@media (max-width:640px){.toolbar{gap:10px;padding:12px 0}.toolbar .seg{order:1}#addBtn{order:2;margin-left:auto;padding:8px 14px}.chips{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}.chip{flex:none}}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.salechip[aria-pressed="true"]{background:var(--sale);border-color:var(--sale);color:var(--paper)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 16px;font:600 13px var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:var(--line);color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.note{margin:16px 0 0;padding:12px 14px;border-left:2px solid var(--ink);background:var(--soft);font-size:14px;color:var(--muted)}
.note strong{color:var(--ink)}

section.group{padding-top:44px}
.ghead{display:flex;align-items:baseline;gap:12px;padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.ghead h2{font-family:var(--display);font-style:italic;font-weight:400;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.ghead .cnt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ghead .sv{margin-left:auto;font-size:13px;color:var(--sale);font-weight:600;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:32px 24px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}}
.card{display:flex;flex-direction:column;min-width:0}
.card.example{opacity:.7}
.ph{position:relative;aspect-ratio:3/4;background:var(--soft);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:54px;color:var(--muted);opacity:.6}
.badge{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--paper);font:700 12px var(--body);padding:4px 8px;letter-spacing:.04em}
.stchip{position:absolute;bottom:10px;left:10px;font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--card);color:var(--muted);border:0}
.stchip.sale{color:var(--sale)}
.stchip.full{color:var(--muted)}
.stchip.soldout{color:var(--warn)}
.stchip.error{color:var(--warn)}
.stchip.hit{background:var(--sale);color:var(--paper)}
.ex{position:absolute;top:10px;right:10px;font:700 10px var(--body);letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:3px 7px}
.body{padding:12px 0 0;display:flex;flex-direction:column;gap:4px;flex:1}
.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.name{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.variant{font-size:13px;color:var(--muted)}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:4px;font-variant-numeric:tabular-nums}
.price .now{font-weight:700;font-size:16px}
.price .now.s{color:var(--sale)}
.price .was{color:var(--muted);text-decoration:line-through;font-size:13px}
.max{font-size:12px;color:var(--muted)}
.scan{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.actions .btn{padding:7px 14px;font-size:12px}

.empty{padding:40px 0 8px;display:grid;gap:10px;max-width:60ch}
.empty h2{font-family:var(--display);font-style:italic;font-weight:400;font-size:30px;margin:0}
.empty p{margin:0;color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto;z-index:20}
.scrim.open{display:flex}
.modal{background:var(--card);color:var(--ink);width:min(620px,100%);border:1px solid var(--line);padding:24px;display:grid;gap:16px}
.modal h3{font-family:var(--display);font-style:italic;font-weight:400;font-size:30px;margin:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.f{display:grid;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{font:15px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px;border-radius:0;width:100%}
.f textarea{min-height:64px;resize:vertical}
.drop{display:flex;gap:14px;align-items:center;border:1px dashed var(--line);padding:12px;background:var(--paper)}
.drop .thumb{width:72px;aspect-ratio:3/4;background:var(--soft);border:1px solid var(--line);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center}
.drop .thumb img{width:100%;height:100%;object-fit:cover}
.drop p{margin:0;font-size:13px;color:var(--muted)}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mfoot .sp{flex:1}
.hint{margin:0;font-size:13px;color:var(--muted);background:var(--soft);padding:12px}
.err{color:var(--ink);font-weight:600;font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;font-size:14px;border-radius:999px;display:none;z-index:30}
.toast.show{display:block}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brandrow">
      <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="Black Friday Edit logo"><g transform="rotate(-10 24 24)"><path d="M3 24 L15 10 H42 Q45 10 45 13 V35 Q45 38 42 38 H15 Z" fill="var(--ink)"/><circle cx="13" cy="24" r="2.6" fill="var(--paper)"/><text x="31" y="30.5" text-anchor="middle" font-family="'Bodoni Moda', Didot, Georgia, serif" font-style="italic" font-size="17" fill="var(--paper)">BF</text></g></svg>
      <h1>The <b>Black Friday</b> Edit</h1>
    </div>
    <div class="meta"><div class="stats" id="stats"></div><span class="kicker" id="scanline">Price checks: 25, 27 &amp; 30 Nov</span></div>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Sort and filter">
    <div class="seg" role="group" aria-label="Group by">
      <button type="button" id="gBrand" aria-pressed="true">By brand</button>
      <button type="button" id="gType" aria-pressed="false">By type</button>
    </div>
    <div class="chips" id="chips"></div>
    <button type="button" class="btn accent" id="addBtn">+ Add a piece</button>
  </div>

  <div id="status" class="note" hidden></div>
  <main id="list"></main>
</div>

<div class="scrim" id="scrim" aria-hidden="true">
  <form class="modal" id="form" role="dialog" aria-modal="true" aria-labelledby="mTitle" novalidate>
    <h3 id="mTitle">Add a piece</h3>
    <div class="fgrid">
      <div class="f full"><label for="fUrl">Product link</label><input id="fUrl" type="url" placeholder="https://" required></div>
      <div class="f"><label for="fBrand">Brand</label><input id="fBrand" list="brandList" required><datalist id="brandList"></datalist></div>
      <div class="f"><label for="fType">Type</label><select id="fType"></select></div>
      <div class="f full"><label for="fName">Item</label><input id="fName" placeholder="e.g. Linen midi dress" required></div>
      <div class="f"><label for="fVariant">Size / colour</label><input id="fVariant" placeholder="e.g. AU 10, black"></div>
      <div class="f"><label for="fUsual">Usual price (AUD)</label><input id="fUsual" type="number" min="0" step="0.01" inputmode="decimal"></div>
      <div class="f"><label for="fMax">Most I'd pay (AUD)</label><input id="fMax" type="number" min="0" step="0.01" inputmode="decimal"></div>
      <div class="f"><label for="fPrio">Priority</label><select id="fPrio"><option value="2">Want</option><option value="3">Must have</option><option value="1">Only if cheap</option></select></div>
      <div class="f full"><p class="hint">Next you'll land on GitHub with these details filled in. Drag a photo in there if you like, then press <strong>Create</strong>. With no photo, the site tries to use the shop's own product photo. Your piece appears here a minute or two later.</p></div>
      <div class="f full"><label for="fNotes">Notes</label><textarea id="fNotes" placeholder="Anything to remember, like 'runs small'"></textarea></div>
    </div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="mfoot">
      <button type="button" class="btn danger" id="delBtn" hidden>Delete</button>
      <span class="sp"></span>
      <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn" id="saveBtn">Continue on GitHub</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const REPO="ellalwoods/black_friday";
const TYPES=["Tops","Knitwear","Dresses","Skirts","Pants & jeans","Outerwear","Tailoring","Activewear","Swim","Shoes","Bags","Jewellery","Accessories","Beauty","Home","Other"];
const PRIO={1:"Only if cheap",2:"Want",3:"Must have"};
const EXAMPLES=[
 {id:"ex1",example:true,brand:"Example brand",name:"Relaxed linen shirt",type:"Tops",variant:"AU 10, white",usualPrice:149,maxPrice:110,salePrice:104.3,status:"sale",url:"#"},
 {id:"ex2",example:true,brand:"Example brand",name:"Leather ballet flats",type:"Shoes",variant:"EU 38",usualPrice:220,maxPrice:160,status:"full",url:"#"},
 {id:"ex3",example:true,brand:"Another label",name:"Wool-blend coat",type:"Outerwear",variant:"S, camel",usualPrice:450,maxPrice:300,status:"unchecked",url:"#"}
];
let items=[], meta={}, loaded=false;
let groupBy="brand", typeFilter=null, saleOnly=false, editing=null, delArmed=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const aud=n=>(n==null||n===""||isNaN(n))?"":new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:(Math.round(n)==n?0:2)}).format(n);
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:null;
const safeImg=p=>/^images\/[A-Za-z0-9._-]+$/.test(p||"")?p:null;
function pctOff(it){return (it.salePrice!=null&&it.usualPrice)?Math.round((1-it.salePrice/it.usualPrice)*100):null}
function isHit(it){return it.status==="sale"&&it.salePrice!=null&&it.maxPrice!=null&&it.salePrice<=it.maxPrice}
function fmtWhen(iso){if(!iso)return"";const d=new Date(iso);return isNaN(d)?"":d.toLocaleString("en-AU",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit",timeZone:"Australia/Brisbane"})}
function src(){return items.length?items:(loaded?EXAMPLES:[])}
function shown(){return src().filter(it=>(!typeFilter||it.type===typeFilter)&&(!saleOnly||it.status==="sale"))}

function renderStats(){
  const onSale=items.filter(i=>i.status==="sale"),hits=items.filter(isHit);
  const saved=onSale.reduce((a,i)=>a+((i.usualPrice&&i.salePrice!=null)?Math.max(0,i.usualPrice-i.salePrice):0),0);
  $("#stats").innerHTML=`
   <div class="stat"><span class="n">${items.length}</span><span class="l"> saved</span></div>
   <div class="stat sale"><span class="n">${onSale.length}</span><span class="l"> on sale</span></div>
   <div class="stat sale"><span class="n">${hits.length}</span><span class="l"> under your price</span></div>
   <div class="stat"><span class="n">${aud(saved)||"$0"}</span><span class="l"> off</span></div>`;
  if(meta.lastRun)$("#scanline").textContent="Checked "+fmtWhen(meta.lastRun);
}
function renderChips(){
  const s=items.length?items:EXAMPLES;
  const present=TYPES.filter(t=>s.some(i=>i.type===t));
  $("#chips").innerHTML=`<button type="button" class="chip salechip" data-sale aria-pressed="${saleOnly}">On sale</button>`+
   `<button type="button" class="chip" data-type="" aria-pressed="${!typeFilter}">All</button>`+
   present.map(t=>`<button type="button" class="chip" data-type="${esc(t)}" aria-pressed="${typeFilter===t}">${esc(t)}</button>`).join("");
}
function card(it){
  const off=pctOff(it),hit=isHit(it),im=safeImg(it.image);
  const st={sale:hit?"Under your price":"On sale",full:"Full price",soldout:"Sold out in your size",error:"Couldn't check",unchecked:"Not checked yet"}[it.status||"unchecked"]||"Not checked yet";
  const stc=hit?"hit":(it.status||"unchecked");
  const priceHtml=(it.status==="sale"&&it.salePrice!=null)
    ?`<span class="now s">${aud(it.salePrice)}</span>${it.usualPrice?`<span class="was">${aud(it.usualPrice)}</span>`:""}`
    :(it.usualPrice?`<span class="now">${aud(it.usualPrice)}</span>`:"");
  const link=safeUrl(it.url);
  return `<article class="card${it.example?" example":""}">
    <div class="ph"><div class="mono" aria-hidden="true">${esc((it.brand||"?").trim().slice(0,1).toUpperCase())}</div>${im?`<img src="${esc(im)}" alt="${esc(it.name)}" loading="lazy" onerror="this.remove()">`:""}
      ${off>0&&it.status==="sale"?`<span class="badge">−${off}%</span>`:""}
      ${it.example?`<span class="ex">Example</span>`:""}
      <span class="stchip ${esc(stc)}">${st}</span></div>
    <div class="body">
      <div class="brand">${esc(it.brand)}</div>
      <div class="name">${esc(it.name)}</div>
      ${it.variant?`<div class="variant">${esc(it.variant)}</div>`:""}
      <div class="price">${priceHtml}</div>
      ${it.maxPrice!=null?`<div class="max">Your max ${aud(it.maxPrice)}</div>`:""}
      ${it.scanNote?`<div class="scan">${esc(it.scanNote)}</div>`:""}
      <div class="actions">
        ${link?`<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Shop ↗</a>`:""}
        ${it.example?"":`<button type="button" class="btn ghost" data-edit="${esc(it.id)}">Edit</button>`}
      </div>
    </div></article>`;
}
function sortItems(a){return a.slice().sort((x,y)=>(isHit(y)-isHit(x))||((y.status==="sale")-(x.status==="sale"))||((y.priority||2)-(x.priority||2))||String(x.name).localeCompare(String(y.name)))}
function render(){
  renderStats();renderChips();
  const list=$("#list");if(!loaded){list.innerHTML="";return}
  let pre="";
  if(!items.length)pre=`<div class="empty"><h2>Start your edit</h2><p>Add each piece you're eyeing with its link, size and the most you'd pay. You can also send links to Claude in chat. On each check date Claude visits every link, records the sale price and flags what's dropped under your price.</p><p><button type="button" class="btn accent" data-add>+ Add your first piece</button></p></div>`;
  const s=shown();
  if(!s.length){list.innerHTML=pre+`<div class="empty"><p>Nothing matches these filters.</p></div>`;return}
  const groups=new Map();
  for(const it of s){const k=groupBy==="brand"?(it.brand||"Unbranded"):(it.type||"Other");if(!groups.has(k))groups.set(k,[]);groups.get(k).push(it)}
  let keys=[...groups.keys()];
  keys=groupBy==="brand"?keys.sort((a,b)=>a.localeCompare(b)):keys.sort((a,b)=>TYPES.indexOf(a)-TYPES.indexOf(b));
  list.innerHTML=pre+keys.map(k=>{const g=sortItems(groups.get(k));
    const sv=g.filter(i=>i.status==="sale"&&i.usualPrice&&i.salePrice!=null).reduce((a,i)=>a+(i.usualPrice-i.salePrice),0);
    return `<section class="group"><div class="ghead"><h2>${esc(k)}</h2><span class="cnt">${g.length} ${g.length===1?"piece":"pieces"}</span>${sv>0?`<span class="sv">${aud(sv)} off</span>`:""}</div><div class="grid">${g.map(card).join("")}</div></section>`}).join("");
}

$("#gBrand").onclick=()=>{groupBy="brand";$("#gBrand").setAttribute("aria-pressed","true");$("#gType").setAttribute("aria-pressed","false");render()};
$("#gType").onclick=()=>{groupBy="type";$("#gType").setAttribute("aria-pressed","true");$("#gBrand").setAttribute("aria-pressed","false");render()};
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;if(b.hasAttribute("data-sale"))saleOnly=!saleOnly;else typeFilter=b.dataset.type||null;render()});
$("#list").addEventListener("click",e=>{const ed=e.target.closest("[data-edit]");if(ed)openForm(items.find(i=>i.id===ed.dataset.edit));if(e.target.closest("[data-add]"))openForm(null)});
$("#addBtn").onclick=()=>openForm(null);
$("#cancelBtn").onclick=closeForm;
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeForm()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#scrim").classList.contains("open"))closeForm()});
$("#fType").innerHTML=TYPES.map(t=>`<option>${esc(t)}</option>`).join("");

function openForm(it){
  editing=it||null;delArmed=false;
  $("#mTitle").textContent=it?"Edit piece":"Add a piece";
  $("#fUrl").value=it?.url||"";$("#fBrand").value=it?.brand||"";$("#fName").value=it?.name||"";
  $("#fType").value=it?.type||"Tops";$("#fVariant").value=it?.variant||"";
  $("#fUsual").value=it?.usualPrice??"";$("#fMax").value=it?.maxPrice??"";$("#fPrio").value=String(it?.priority||2);
  $("#fNotes").value=it?.notes||"";$("#fErr").textContent="";
  $("#delBtn").hidden=!it;$("#delBtn").textContent="Remove";
  $("#brandList").innerHTML=[...new Set(items.map(i=>i.brand).filter(Boolean))].map(b=>`<option value="${esc(b)}">`).join("");
  $("#scrim").classList.add("open");$("#scrim").setAttribute("aria-hidden","false");
  setTimeout(()=>$("#fUrl").focus(),30);
}
function closeForm(){$("#scrim").classList.remove("open");$("#scrim").setAttribute("aria-hidden","true")}
function issueUrl(title,body){return `https://github.com/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`}
function go(u){window.location.href=u}

$("#delBtn").onclick=()=>{
  if(!delArmed){delArmed=true;$("#delBtn").textContent="Tap again to remove";return}
  go(issueUrl(`Remove: ${editing.brand} ${editing.name}`,`ID: ${editing.id}\n\nPress Create to remove this piece from your edit.`));
};
$("#form").addEventListener("submit",e=>{
  e.preventDefault();
  const url=$("#fUrl").value.trim(),brand=$("#fBrand").value.trim(),name=$("#fName").value.trim();
  if(!safeUrl(url)){$("#fErr").textContent="Paste the full product link, starting with https://";return}
  if(!brand||!name){$("#fErr").textContent="Add the brand and the item name.";return}
  const lines=[
    editing?`ID: ${editing.id}`:null,
    `Link: ${url}`,`Brand: ${brand}`,`Item: ${name}`,`Type: ${$("#fType").value}`,
    `Size/colour: ${$("#fVariant").value.trim()}`,`Usual price: ${$("#fUsual").value}`,`Max price: ${$("#fMax").value}`,
    `Priority: ${PRIO[$("#fPrio").value]||"Want"}`,`Notes: ${$("#fNotes").value.trim().replace(/\n/g," ")}`,
    "",editing?"Photo: drag a new photo here to replace the current one (optional)":"Photo: drag a photo here (optional)",""
  ].filter(l=>l!==null);
  go(issueUrl(`${editing?"Edit":"Add"}: ${brand} ${name}`,lines.join("\n")));
});

(async()=>{
  render();
  try{
    const r=await fetch("data/items.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();items=Array.isArray(d.items)?d.items:[];meta=d;
  }catch(e){const s=$("#status");s.innerHTML="<strong>Couldn't load your list.</strong> Refresh the page to try again.";s.hidden=false}
  loaded=true;render();
})();
</script>
</body>
</html>
