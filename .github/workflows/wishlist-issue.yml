name: Update wishlist from issue
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: wishlist
  cancel-in-progress: false
jobs:
  apply:
    # Only the repo owner's Add/Edit/Remove issues change the list.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'Add:') ||
       startsWith(github.event.issue.title, 'Edit:') ||
       startsWith(github.event.issue.title, 'Remove:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Apply issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/apply_issue.py
      - name: Fill photos and stock
        run: python .github/scripts/fill_missing.py || true
      - name: Commit
        run: |
          git config user.name "wishlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data images
          if ! git diff --cached --quiet; then
            git commit -m "Wishlist: update from issue #${{ github.event.issue.number }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f /tmp/reply.md ] || echo "Done." > /tmp/reply.md
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "$(cat /tmp/reply.md)"
  publish:
    needs: apply
    uses: ./.github/workflows/deploy.yml
